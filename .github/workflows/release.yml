name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  build-unix:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package archive
        shell: bash
        run: |
          archive="codex-accounts-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" codex-accounts -C "$GITHUB_WORKSPACE" completions
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: codex-accounts-${{ matrix.target }}
          path: |
            codex-accounts-${{ matrix.target }}.tar.gz
            codex-accounts-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package archive
        shell: pwsh
        run: |
          $archive = 'codex-accounts-x86_64-pc-windows-msvc.zip'
          Compress-Archive -Path 'target/x86_64-pc-windows-msvc/release/codex-accounts.exe', 'completions' -DestinationPath $archive
          (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() + "  " + $archive | Set-Content -NoNewline "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: codex-accounts-x86_64-pc-windows-msvc
          path: |
            codex-accounts-x86_64-pc-windows-msvc.zip
            codex-accounts-x86_64-pc-windows-msvc.zip.sha256
          if-no-files-found: error

  release:
    needs: [build-unix, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Combine checksums
        run: cat release-assets/*.sha256 > release-assets/checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/*.tar.gz release-assets/*.zip release-assets/checksums.txt --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/*.tar.gz release-assets/*.zip release-assets/checksums.txt --generate-notes
          fi
